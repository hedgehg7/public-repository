<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{% if product_id %}Редактирование{% else %}Добавление{% endif %} продукта</title>
    <link href="https://fonts.googleapis.com/css2?family=Gabriola&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Gabriola', sans-serif;
        }
        body {
            background-color: #FFFFFF;
            color: #2D6033;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #BBD9B2;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 {
            color: #2D6033;
            text-align: center;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 1.2em;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #2D6033;
            border-radius: 5px;
            font-size: 1.1em;
            background-color: white;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .btn-primary {
            background-color: #2D6033;
            color: white;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .error {
            color: #dc3545;
            font-weight: bold;
            margin-top: 5px;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        .logo {
            height: 60px;
            margin-right: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Логотип" class="logo">
            <h2>{% if product_id %}Редактирование{% else %}Добавление{% endif %} продукта</h2>
        </div>
        
        <!-- Отображение сообщений об ошибках -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="messages">
                    {% for category, message in messages %}
                        <div class="error">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <label for="article_number">Артикул:</label>
                <input type="number" id="article_number" name="article_number" 
                       value="{{ article_number if article_number else '' }}" required>
            </div>
            
            <div class="form-group">
                <label for="type_id">Тип продукта:</label>
                <select id="type_id" name="type_id" required>
                    <option value="">Выберите тип продукта</option>
                    {% for pt in product_types %}
                        <option value="{{ pt['id'] }}"
                            {% if type_id and pt['id'] == type_id|int %}selected{% endif %}>
                            {{ pt['type_name'] }}
                        </option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label for="name">Наименование:</label>
                <input type="text" id="name" name="name" 
                       value="{{ name if name else '' }}" required>
            </div>
            
            <div class="form-group">
                <label for="min_partner_price">Минимальная цена для партнера:</label>
                <input type="number" step="0.01" id="min_partner_price" name="min_partner_price" 
                       value="{{ min_partner_price if min_partner_price else '' }}" required min="0">
            </div>
            
            <div class="form-group">
                <label for="roll_width">Ширина рулона (м):</label>
                <input type="number" step="0.01" id="roll_width" name="roll_width" 
                       value="{{ roll_width if roll_width else '' }}" required min="0.1">
            </div>
            
            <div class="btn-group">
                <button type="submit" class="btn btn-primary">Сохранить</button>
                <a href="{{ url_for('index') }}" class="btn btn-secondary">Отмена</a>
            </div>
        </form>
    </div>
</body>
</html>
